name: IntelliWatch CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r monitoring-engine/requirements.txt
      - name: Check Python
        run: python scripts/check_python.py

  ui-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install root dependencies
        run: npm install
      - name: Install UI dependencies
        run: npm --prefix desktop/react-ui install
      - name: Build UI
        run: npm run build:ui
